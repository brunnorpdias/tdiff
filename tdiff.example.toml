# tdiff-only overrides. Optional, and usually absent.
#
# Install to ~/.config/tconfig/tdiff.toml. Everything that describes the vault lives
# in that folder's notation.toml and statuses.toml, shipped by `tnotes` and read by
# both tools. This file is for the cases where you want tdiff to differ from tcat —
# which should be rare, since a vault that looked like two vaults depending on which
# tool asked was the problem the shared folder solves.
#
# It is an overlay, not a replacement: a partial file here never erases what a lower
# layer set. Lists do replace wholesale, though — naming a partial [dedup].priority
# means exactly those tiers, and a partial [order].statuses means exactly that order
# with everything else sorting last.
#
# [roles]
# hide = []          # show overrun/postponed/advanced by default
# settled = ["x"]    # make -I hide only done tasks, not cancelled ones too
#
# [order]
# statuses = ["!", "*", " ", "x"]    # sort rows differently here than in tcat
