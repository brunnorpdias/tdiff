# tdiff-only settings.
#
# Install to ~/.config/tdiff/config.toml. This file is an *overlay* on
# statuses.example.toml (installed at ~/.config/obsidian-tasks/statuses.toml), not a
# replacement for it. Nothing here is required.
#
# Layers, lowest precedence first — each merges over the ones below it, so a
# partial file here never erases what the shared table set:
#
#   1. ~/.config/obsidian-tasks/statuses.toml   the shared vault vocabulary
#   2. ~/.config/tdiff/config.toml              this file
#   3. $TDIFF_CONFIG
#   4. --config <path>
#
# There is no built-in layer beneath these, and nothing is ever created for you.
# With none of them present tdiff exits with an error rather than guessing: without
# [roles] project it would leak project headers into every diff, and without [dedup]
# it would pick an arbitrary status for any task stated twice.


[exclude]
# Sections never read, in any note — daily or weekly. A section is a heading at any
# level *or* a bold-only line, so "fixa", "actio fixa" and "actio > future" all name
# something real; ">" separates outline ancestors, reading outward-in, and levels may
# sit between them. A section runs until the next node at the same or shallower level,
# and everything nested inside it goes with it.
#
# Emphasis, backticks and case are formatting, not name: "*Actio Fixa*", "**future**"
# and "actio fixa" are all written here as bare lowercase words. That is the point —
# move the bucket from **future** to ### backlog and only the word changes here.
#
# Fenced code blocks are skipped whatever this says, so a task list frozen inside one
# needs no entry here. This list is for the rest — and it is the durable version of the
# same idea, naming a section for what it is called rather than for how it happens to
# be formatted. Nothing is special-cased by name, "future" included. --all ignores this
# list for one run, and does not lift the fence.
#
# The list below is this vault's. "futura" is the weekly note's deferral section, an
# H3 beside "### *Actio*"; naming it here is what keeps next week's plans out of this
# week's diff, and dropping the line is how you ask to see them.
sections = [
  "fixa",
  "actio fixa",
  "futura",
  "reflectio vespertina",
  "previous daily log template",
]


[vault]
# Optional. If set (non-empty), daily/weekly lookups are prefixed with this folder.
# If empty or omitted, files resolve by name anywhere in the vault — which is how
# `obsidian read file=` behaves natively, so leaving these empty is usually right.
daily_folder = ""
weekly_folder = ""


# Anything from statuses.toml can be overridden here when you want tdiff to differ
# from the shared table. Lists replace wholesale rather than merging element-wise:
# naming a partial [dedup].priority means exactly those tiers, and a partial
# [order].statuses means exactly that order with everything else sorting last.
#
# [roles]
# hide = []          # show overrun/postponed/advanced by default
# settled = ["x"]    # make -I hide only done tasks, not cancelled ones too
#
# [dedup]
# priority = [["x"], ["-"], [" "]]
#
# [order]
# statuses = ["!", "*", " ", "x"]    # sort rows differently here than in tcat
