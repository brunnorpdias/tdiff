# tdiff-only settings.
#
# Install to ~/.config/tdiff/config.toml. Entirely optional: this file is an
# *overlay* on statuses.example.toml (installed at
# ~/.config/obsidian-tasks/statuses.toml), not a replacement for it.
#
# Layers, lowest precedence first — each merges over the ones below it, so a
# partial file here never erases what the shared table set:
#
#   1. ~/.config/obsidian-tasks/statuses.toml   the shared vault vocabulary
#   2. ~/.config/tdiff/config.toml              this file
#   3. $TDIFF_CONFIG
#   4. --config <path>
#
# There is no built-in layer beneath these, and nothing is ever created for you.
# With none of them present tdiff exits with an error rather than guessing: without
# [roles] project it would leak project headers into every diff, and without [dedup]
# it would pick an arbitrary status for any task stated twice.


[vault]
# Optional. If set (non-empty), daily/weekly lookups are prefixed with this folder.
# If empty or omitted, files resolve by name anywhere in the vault — which is how
# `obsidian tasks file=` behaves natively, so leaving these empty is usually right.
daily_folder = ""
weekly_folder = ""


# Anything from statuses.toml can be overridden here when you want tdiff to differ
# from the shared table. Lists replace wholesale rather than merging element-wise:
# naming a partial [dedup].priority means exactly those tiers.
#
# [roles]
# hide = []          # show overrun/postponed/advanced by default
# settled = ["x"]    # make -I hide only done tasks, not cancelled ones too
#
# [dedup]
# priority = [["x"], ["-"], [" "]]
